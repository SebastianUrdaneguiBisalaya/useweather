name: Publish to npm

# Publishing is a deliberate step: version the packages with changesets (`pnpm run version-packages`), merge that to
# `main`, then publish a GitHub Release. Every package whose version isn't on npm yet is published; the rest are
# skipped, so one release can ship one package or both.
on:
  release:
    types: [published]

jobs:
  publish:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4 # keep in sync with devEngines.packageManager

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Smoke-check the packed packages (ESM, CJS, types)
        run: pnpm run smoke:pack

      # Auth goes first: publishing rewrites each integration's `workspace:^` peer range to `^<auth version>`, so that
      # version must already be on npm. Add every new integration after auth.
      - name: Publish new versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in packages/auth packages/google-calendar packages/nager-date packages/open-meteo; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")

            # `pnpm view` fails with a 404 for a package that was never published, and with
            # ERR_PNPM_PACKAGE_NOT_FOUND for a version that wasn't. Any other error (network, auth) stops the
            # release instead of risking a wrong guess.
            if published=$(pnpm view "$name@$version" version 2>view-error.log); then
              if [ "$published" = "$version" ]; then
                echo "::notice::$name@$version is already on npm, skipping."
                continue
              fi
            elif ! grep -qE "404|ERR_PNPM_PACKAGE_NOT_FOUND" view-error.log; then
              cat view-error.log
              echo "::error::Couldn't check whether $name@$version is published."
              exit 1
            fi

            echo "Publishing $name@$version"
            (cd "$dir" && pnpm publish --access public --no-git-checks --provenance)
          done