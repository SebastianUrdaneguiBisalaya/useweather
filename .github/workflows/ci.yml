name: CI

# Runs the same checks as the git hooks, independently of them (hooks can be skipped with --no-verify).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4 # keep in sync with devEngines.packageManager

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build packages
        run: pnpm run build

      - name: Smoke-check the packed packages (ESM, CJS, types)
        run: pnpm run smoke:pack

      - name: Build playground
        run: pnpm --filter website run build
